# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  release:
    types:
      - published

jobs:
  build:

    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            fentwums-netlist-reader-server/pom.xml
            fentwums-netlist-reader-service/pom.xml
      - name: Build with Maven
        run: mvn clean install
      - name: Create staging directory
        run: mkdir fentwums-fms
      - name: Move assets to staging directory
        run: cp fentwums-fsm/target/*.jar fentwums-fms
      - name: Create tar
        run: tar -czf fentwums-fsm-${{ github.ref_name }}.tar.gz fentwums-fsm/*
      - name: Check for existence of archive
        run: ls -lsha && ls -lsha fentwums-fsm
      - name: Show archive contents
        run : tar -tvf fentwums-fsm-${{ github.ref_name }}.tar.gz
      - name: Release artifact
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          replacesArtifacts: false
          generateReleaseNotes: true
          artifacts: "fentwums-fsm-${{ github.ref_name }}.tar.gz,fentwums-fsm/*.jar"
          omitBodyDuringUpdate: true

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # - name: Update dependency graph
    #   uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6